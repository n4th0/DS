version: "3.9"

services:
  # ---------------- Kafka (KRaft, official Apache image) ----------------
  kafka:
    image: apache/kafka:latest
    container_name: wm-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data" # <-- ensures data goes to the volume
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - wm_net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------- Kafka topic initializer ----------------
  kafka-init:
    image: apache/kafka:latest
    container_name: wm-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/kafka-setup.sh"]
    volumes:
      - ./kafka-setup.sh:/scripts/kafka-setup.sh:ro
    environment:
      KAFKA_BROKER: "kafka:9092"
    networks:
      - wm_net
  # ---------------- Central (WM_Central) ----------------
  central:
    build:
      context: .
      dockerfile: core/Dockerfile
    container_name: wm-central
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "5000:5000" # socket server for monitors
    environment:
      WM_SOCKET_PORT: "5000"
      KAFKA_BROKER: "kafka:9092"
      DB_PATH: "/data/wm_central.db"
    volumes:
      - central_db:/data # <-- SQLite persistence
    stdin_open: true # keep menu interactive
    tty: true
    networks:
      - wm_net

  # ---------------- Watering Station 1 (Engine + Monitor) ----------------
  ws1_engine:
    build:
      context: .
      dockerfile: station/Dockerfile.engine
    container_name: wm-ws1-engine
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: "kafka:9092"
      WS_ID: "WS-01"
      MONITOR_PORT: "6000"
    ports:
      - "6000:6000"
    networks:
      - wm_net

  ws1_monitor:
    build:
      context: .
      dockerfile: station/Dockerfile.monitor
    container_name: wm-ws1-monitor
    restart: unless-stopped
    depends_on:
      - ws1_engine
      - central
    environment:
      WS_ID: "WS-01"
      ENGINE_HOST: "ws1_engine"
      ENGINE_PORT: "6000"
      CENTRAL_HOST: "central"
      CENTRAL_PORT: "5000"
    stdin_open: true
    tty: true
    networks:
      - wm_net

  # ---------------- Watering Station 2 ----------------
  ws2_engine:
    build:
      context: .
      dockerfile: station/Dockerfile.engine
    container_name: wm-ws2-engine
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: "kafka:9092"
      WS_ID: "WS-02"
      MONITOR_PORT: "6001"
    ports:
      - "6001:6001"
    networks:
      - wm_net

  ws2_monitor:
    build:
      context: .
      dockerfile: station/Dockerfile.monitor
    container_name: wm-ws2-monitor
    restart: unless-stopped
    depends_on:
      - ws2_engine
      - central
    environment:
      WS_ID: "WS-02"
      ENGINE_HOST: "ws2_engine"
      ENGINE_PORT: "6001"
      CENTRAL_HOST: "central"
      CENTRAL_PORT: "5000"
    stdin_open: true
    tty: true
    networks:
      - wm_net

  # ---------------- Field Operator ----------------
  operator1:
    build:
      context: .
      dockerfile: operator/Dockerfile
    container_name: wm-fo1
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKER: "kafka:9092"
      OPERATOR_ID: "FO-01"
      SERVICES_FILE: "/app/services.txt"
    volumes:
      - ./operator/services.txt:/app/services.txt:ro
    stdin_open: true
    tty: true
    networks:
      - wm_net

volumes:
  kafka_data:
    driver: local
  central_db:
    driver: local

networks:
  wm_net:
    driver: bridge
